name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump. Fixes are a patch, new features minor.
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the build provenance attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog compares against the previous tag
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Bump the version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Updates manifest.json, versions.json and CHANGELOG.md, then commits and tags
          npm version "${{ inputs.bump }}" -m "chore: release %s"
          echo "tag=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Write the release notes
        # The newest section of the changelog, without its heading
        run: awk '/^#{1,2} \[?[0-9]/ { if (found++) exit; next } found' CHANGELOG.md > notes.md

      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag \
            main.js manifest.json styles.css
